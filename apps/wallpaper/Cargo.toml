[package]
name = "matrix-wallpaper"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Matrix Hintergrund — der Wallpaper-Dienst: malt das Bild, erzeugt die Palette"

[dependencies]
matrixkit-theme = { path = "../../matrixkit-theme" }
matrixkit-widgets = { path = "../../matrixkit-widgets" }
matrixkit-text = { path = "../../matrixkit-text" }
matrixkit-image = { path = "../../matrixkit-image" }
matrixkit-canvas = { path = "../../matrixkit-canvas" }
matrixkit-shell = { path = "../../matrixkit-shell" }
serde_json = "1"
# First light (stage 2): Wayland first-hand - the same
# foundations that also sit under iced, just without a middleman.
wayland-client = "0.31"
wayland-protocols-wlr = { version = "0.3", features = ["client"] }
memmap2 = "0.9"
libc = "0.2"
image = "0.25"
