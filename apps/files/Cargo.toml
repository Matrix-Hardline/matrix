[package]
name = "matrix-files"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Matrix Dateien — der Dateimanager: Orte, Liste, Verschieben und Kopieren auf den USB-Stick (Fensterhaus, ohne iced; --iced = bisherige Fassung)"

[dependencies]
matrixkit-theme = { path = "../../matrixkit-theme" }
matrixkit-widgets = { path = "../../matrixkit-widgets", features = ["picture"] }
matrixkit-icons = { path = "../../matrixkit-icons" }
matrixkit-scene = { path = "../../matrixkit-scene" }
matrixkit-shell = { path = "../../matrixkit-shell" }
matrixkit-text = { path = "../../matrixkit-text" }
matrixkit-image = { path = "../../matrixkit-image" }
chrono = "0.4"
unicode-normalization = "0.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png"] }
