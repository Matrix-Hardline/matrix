[package]
name = "matrix-capture"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Matrix Aufnahme — Bildschirmfoto und -film in der Leitbild-Grammatik"

[dependencies]
matrixkit-video = { path = "../../matrixkit-video" }
matrixkit-gpu = { path = "../../matrixkit-gpu" }
libc = "0.2"
serde_json = "1"
matrixkit-theme = { path = "../../matrixkit-theme" }
matrixkit-widgets = { path = "../../matrixkit-widgets" }
# Lager 67: the first-light path.
matrixkit-shell = { path = "../../matrixkit-shell" }
matrixkit-text = { path = "../../matrixkit-text" }
matrixkit-image = { path = "../../matrixkit-image" }
# Corner re-rounding of window screenshots (already in the tree through iced anyway)
image = "0.25"
