[package]
name = "matrix-camera"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Matrix Kamera — die Duo-Kamera ohne CamX: Live-Bild, Belichtung, 11-MP-Fotos"

[dependencies]
matrixkit-shell = { path = "../../matrixkit-shell" }
matrixkit-text = { path = "../../matrixkit-text" }
matrixkit-image = { path = "../../matrixkit-image" }
matrixkit-theme = { path = "../../matrixkit-theme" }
matrixkit-scene = { path = "../../matrixkit-scene" }
image = { version = "0.25", default-features = false, features = ["png"] }
