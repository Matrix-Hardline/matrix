[package]
name = "matrix-greeter"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Matrix Greeter — der Login-Screen: Wallpaper, Avatar, Passwort, Wächter"

[dependencies]
matrixkit-theme = { path = "../../matrixkit-theme" }
matrixkit-icons = { path = "../../matrixkit-icons" }
matrixkit-scene = { path = "../../matrixkit-scene" }
matrixkit-shell = { path = "../../matrixkit-shell" }
matrixkit-text = { path = "../../matrixkit-text" }
matrixkit-image = { path = "../../matrixkit-image" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
