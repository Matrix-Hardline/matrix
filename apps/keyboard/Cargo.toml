[package]
name = "matrix-keyboard"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "Matrix Tastatur — die Bildschirmtastatur, erscheint wenn keine physische tippt"

[dependencies]
libc = "0.2"
matrixkit-theme = { path = "../../matrixkit-theme" }
matrixkit-widgets = { path = "../../matrixkit-widgets" }
# Lager 68: der Erste-Licht-Pfad.
matrixkit-shell = { path = "../../matrixkit-shell" }
matrixkit-scene = { path = "../../matrixkit-scene" }
matrixkit-text = { path = "../../matrixkit-text" }
matrixkit-image = { path = "../../matrixkit-image" }
wayland-client = "0.31"
wayland-protocols-misc = { version = "0.3", features = ["client"] }
